<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;}
      .frozen{fill:#eef2ff;stroke:#6366f1;}
      .mem{fill:#ecfdf5;stroke:#10b981;}
      .score{fill:#fef2f2;stroke:#ef4444;}
      .map{fill:#fffbeb;stroke:#f59e0b;}
      .group{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:4 3;}
      .lane{fill:#f1f5f9;stroke:#e2e8f0;stroke-width:1;}
      .ts{fill:#475569;font-size:11px;}
      .h{fill:#1e293b;font-size:13px;font-weight:600;}
      .edge{stroke:#475569;stroke-width:1.6;fill:none;}
    </style>
  </defs>

  <text x="24" y="26" font-size="18" font-weight="700" fill="#0f172a">Training-free anomaly detection &amp; localization pipeline</text>
  <text x="24" y="46" class="ts">Reference built from defect-free images only · frozen ImageNet backbone, no gradient training.</text>

  <!-- Row 1: input -> backbone -> patch features -->
  <rect class="box" x="24" y="72" width="150" height="92" rx="10"/>
  <text x="99" y="100" class="h" text-anchor="middle">Input image</text>
  <text x="99" y="122" class="ts" text-anchor="middle">resize 256</text>
  <text x="99" y="140" class="ts" text-anchor="middle">center-crop 224</text>
  <text x="99" y="158" class="ts" text-anchor="middle">ImageNet norm</text>

  <rect class="box frozen" x="206" y="72" width="176" height="92" rx="10"/>
  <text x="294" y="100" class="h" text-anchor="middle">Frozen backbone &#10052;</text>
  <text x="294" y="122" class="ts" text-anchor="middle">WideResNet50 / ResNet18</text>
  <text x="294" y="140" class="ts" text-anchor="middle">ImageNet pretrained</text>
  <text x="294" y="158" class="ts" text-anchor="middle">hooks: layer1–3</text>

  <rect class="box" x="414" y="72" width="160" height="92" rx="10"/>
  <text x="494" y="100" class="h" text-anchor="middle">Patch features</text>
  <text x="494" y="122" class="ts" text-anchor="middle">multi-layer concat</text>
  <text x="494" y="140" class="ts" text-anchor="middle">3×3 local pooling</text>
  <text x="494" y="158" class="ts" text-anchor="middle">(B, C, H, W)</text>

  <line class="edge" x1="174" y1="118" x2="204" y2="118" marker-end="url(#arrow)"/>
  <line class="edge" x1="382" y1="118" x2="412" y2="118" marker-end="url(#arrow)"/>
  <line class="edge" x1="574" y1="118" x2="604" y2="118" marker-end="url(#arrow)"/>

  <!-- Anomaly model: two parallel, training-free alternatives -->
  <rect class="group" x="606" y="66" width="336" height="130" rx="10"/>
  <text x="620" y="85" class="h">Anomaly model — choose one</text>

  <rect class="box mem" x="618" y="94" width="312" height="44" rx="8"/>
  <text x="630" y="112" class="h">PaDiM</text>
  <text x="688" y="112" class="ts">per-patch Gaussian</text>
  <text x="630" y="129" class="ts">score = Mahalanobis distance</text>

  <rect class="box mem" x="618" y="146" width="312" height="44" rx="8"/>
  <text x="630" y="164" class="h">PatchCore</text>
  <text x="710" y="164" class="ts">coreset memory bank (1–10%)</text>
  <text x="630" y="181" class="ts">score = nearest-neighbour distance</text>

  <!-- Row 2: anomaly map <- model ; outputs <- map ; evaluation -->
  <rect class="box map" x="606" y="250" width="180" height="88" rx="10"/>
  <text x="696" y="278" class="h" text-anchor="middle">Anomaly map</text>
  <text x="696" y="300" class="ts" text-anchor="middle">upsample → 224²</text>
  <text x="696" y="318" class="ts" text-anchor="middle">Gaussian smooth σ=4</text>

  <rect class="box score" x="350" y="250" width="180" height="88" rx="10"/>
  <text x="440" y="278" class="h" text-anchor="middle">Outputs</text>
  <text x="440" y="300" class="ts" text-anchor="middle">image score = max(map)</text>
  <text x="440" y="318" class="ts" text-anchor="middle">pixel heatmap (where)</text>

  <line class="edge" x1="696" y1="196" x2="696" y2="248" marker-end="url(#arrow)"/>
  <line class="edge" x1="604" y1="294" x2="532" y2="294" marker-end="url(#arrow)"/>
  <line class="edge" x1="440" y1="338" x2="440" y2="358" marker-end="url(#arrow)"/>

  <!-- Evaluation -->
  <rect class="lane" x="24" y="360" width="918" height="70" rx="10"/>
  <text x="44" y="388" class="h">Evaluation</text>
  <text x="44" y="410" class="ts">Image-level AUROC (detection) · Pixel-level AUROC (localization) · PRO score (per-region overlap) · setup + inference time per image</text>
</svg>
